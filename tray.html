<title>Harvey Tray</title>

<style>
/* Layout: the reference card. A blue panel holding the recessed tray (left, top), a cream caption strip under it,
   a white column with the speech bubble reaching over the tray and the wordmark at the foot. */
:root {
  --panel: #3f7abb; --well: #2f639c; --tray: #b2d8e5; --cream: #f5f2ee; --paper: #ffffff; --ink: #141414;
  --bubble-ink: #1f3a0b; --sans: "DM Sans", system-ui, sans-serif;
  --tray-radius: min(8.6vw, 15vh);
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); }
.page { position: fixed; inset: 0; display: grid; grid-template-columns: 60.15% 1fr; grid-template-rows: 71.25% 1fr; }
.panel { grid-area: 1 / 1; background: var(--panel); padding: 4% 4.6% 5.1% 5.5%; box-sizing: border-box; min-height: 0; }
.caption { grid-area: 2 / 1; background: var(--cream); display: grid; place-items: center; padding: 0 6%; }
.caption p { margin: 0; font-size: min(6.3vh, 4.3vw); line-height: 1.2; font-weight: 400; text-align: center; text-wrap: balance; letter-spacing: -.01em; }
.caption span { white-space: nowrap; }
.side { grid-area: 1 / 2 / 3 / 3; background: var(--paper); position: relative; }

/* The well the plate sits in, and the plate itself: tipped in 3D, the low side sinking away. */
.well { position: relative; width: 100%; height: 100%; border-radius: var(--tray-radius); background: var(--well);
  box-shadow: inset 0 4px 10px rgba(8, 30, 60, .45); perspective: 1500px; cursor: grab; touch-action: none; }
.holding .well { cursor: grabbing; }
.tray { position: absolute; inset: 0; border-radius: var(--tray-radius); overflow: hidden; background: var(--tray);
  --deep: 0; --deep-angle: 180deg; --wall-x: 0px; --wall-y: 0px; will-change: transform; }
.tray canvas { display: block; width: 100%; height: 100%; }
.tray::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(var(--deep-angle), rgba(20, 55, 95, 0) 30%, rgba(20, 55, 95, calc(.34 * var(--deep))) 100%);
  box-shadow:
    inset 0 12px 26px rgba(18, 52, 92, .28), inset 0 2px 4px rgba(18, 52, 92, .32),
    inset 0 -3px 6px rgba(255, 255, 255, .6), inset 0 -14px 24px rgba(255, 255, 255, .18),
    inset var(--wall-x) var(--wall-y) 30px rgba(18, 52, 92, calc(.5 * var(--deep))); }

/* The speech bubble: a glossy green pill with its tail on the tray. Its colour follows the battery. */
.bubble { --energy: 1; position: absolute; left: 52%; top: 12.3%; width: 39.5%; aspect-ratio: 800 / 236; z-index: 2;
  container-type: inline-size; pointer-events: none;
  filter: saturate(calc(.25 + .75 * var(--energy))) brightness(calc(.9 + .1 * var(--energy))) drop-shadow(0 .5vw .7vw rgba(30, 40, 20, .18)); }
.bubble svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.bubble p { position: absolute; left: 13%; right: 5%; top: 6%; bottom: 8%; margin: 0; display: grid; place-items: center; text-align: center;
  font-size: 6.6cqi; font-weight: 500; line-height: 1.1; color: var(--bubble-ink); text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
  text-wrap: balance; transition: opacity .25s ease; }
.bubble.pop { animation: pop .45s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes pop { 0% { transform: scale(.94, .9); } 60% { transform: scale(1.02, 1.03); } 100% { transform: none; } }

.wordmark { position: absolute; left: 50%; top: 88%; width: 52%; transform: translate(-50%, -50%); color: var(--panel); }
#hud { position: fixed; right: 16px; top: 12px; margin: 0; font: 12px/1.4 ui-monospace, "IBM Plex Mono", monospace; color: var(--ink); opacity: .6; pointer-events: none; z-index: 3; }
.no-webgl .well::after { content: "This page needs WebGL2."; position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink); }

/* Portrait: the tray on top, the bubble under it, the question at the foot. */
@media (max-aspect-ratio: 1/1) {
  .page { grid-template-columns: 1fr; grid-template-rows: 56% 1fr 20%; }
  .panel { grid-area: 1 / 1; padding: 5%; }
  .side { grid-area: 2 / 1; }
  .caption { grid-area: 3 / 1; }
  .caption p { font-size: min(4.2vh, 7vw); }
  .bubble { left: 4%; top: 49%; width: 84%; }
  .wordmark { top: 74%; left: 76%; width: 38%; }
  :root { --tray-radius: min(12vw, 9vh); }
}
@media (prefers-reduced-motion: reduce) { .bubble.pop { animation: none; } }
</style>
