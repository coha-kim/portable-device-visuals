<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Harvey Pocket on web</title>
  <meta name="description" content="Harvey Pocket on web: show your social battery without words. Press, hold and shake the screen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="exhibit.css?exhibit-10">
</head>
<body>
  <header class="masthead">
    <h1 class="wordmark"><img src="assets/harvey-wordmark-sketch.png" alt="Harvey" width="445" height="78"></h1>
    <p class="intro">Harvey Pocket on web<br>Discover a new way to show your social battery, without words</p>
  </header>

  <main class="stage" id="stage">
    <!-- The battery indicator: a semicircle beside the screen, and a line from its end to the camera. -->
    <svg class="indicator" id="indicator" aria-hidden="true">
      <path class="track" id="track"/>
      <path class="level" id="level"/>
      <line class="leader" id="leader"/>
      <circle class="node" id="node" r="4"/>
    </svg>
    <div class="screen">
      <canvas id="scene" width="480" height="480" aria-label="Orange bubbles on a round screen. Press to tip them; hold and shake to hollow them out."></canvas>
    </div>
    <div class="camera" id="camera">
      <canvas id="mirror" width="480" height="600" aria-label="Camera view: you fade as the battery drains."></canvas>
      <button id="camera-button" type="button">Show me</button>
    </div>
  </main>

  <footer class="controls">
    <button id="shake-button" type="button" aria-pressed="false">Hold to shake</button>
    <button id="motion-button" type="button" hidden>Use phone motion</button>
  </footer>
  <script type="module" src="exhibit.js?exhibit-10"></script>
</body>
</html>
