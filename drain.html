<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harvey Drain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f2ee; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; left: 16px; bottom: 14px; margin: 0; font: 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; color: #2b2b2a; opacity: .7; pointer-events: none; }
  .no-webgl::after { content: "This page needs WebGL2."; position: fixed; inset: 0; display: grid; place-items: center; font: 14px "DM Sans", system-ui, sans-serif; color: #2b2b2a; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Harvey blobs. Press and drag to pinch the page and drain their energy."></canvas>
<p id="hud" hidden></p>
<script type="module" src="drain.mjs?v=1"></script>
</body>
</html>
