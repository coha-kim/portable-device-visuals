<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ECEADB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Portable Device Visuals</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <button id="hold" type="button" aria-label="Hold while shaking" aria-pressed="false" aria-describedby="hint"></button>
  <p id="hint">Hold the corner button and shake.</p>
  <section id="welcome" aria-label="Motion setup">
    <div class="card">
      <p class="eyebrow">PORTABLE DEVICE</p>
      <h1>A little movement,<br>a softer colour.</h1>
      <p>Hold the corner button while you shake. Shake harder to soften the blobs, and longer to change the background. Release to keep the result.</p>
      <button id="enable" type="button">Enable motion</button>
      <button id="view" type="button">Just view the visuals</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </section>
  <button id="retry" type="button" hidden>Enable motion</button>
  <script type="module" src="app.js?v=canvas-2"></script>
</body>
</html>
